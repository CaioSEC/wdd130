<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting</title>
    <meta name="description" content="Contact page for the rafting website project">
    <meta name="author" content="Caio Second">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Website Logo">
        <nav>
            <ul class="navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us - Whitewater Rafting</h1>

        <section class="information">
            <strong>123 Main River Street</strong><br>
            <strong>Kolob, California</strong><br>
            <strong>+1 999 999 9999</strong><br>
            <strong>info@whitewater.com</strong>
        </section>

        <section class="contact-main">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d9797.97671847992!2d-38.504218256119174!3d-3.7226186591159327!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7c748473eaa29b5%3A0x89a748bb35d32c5c!2sEst%C3%A1tua%20de%20Iracema%20Guardi%C3%A3!5e1!3m2!1spt-BR!2sbr!4v1791286197078!5m2!1spt-BR!2sbr"
                  width="400" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Placeholder">
                <p>Purpose</p>
                <label>
                    <input type="radio" name="purpose" value="general">
                    General Inquiry
                </label>
                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>
                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>
                <label>
                    <input type="checkbox" name="newsletter">
                    Please Subscribe me to the monthly newsletter
                </label>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="profiles">
            <h2>We Are Here to Serve You!</h2>
            <div class="employee">
                <img src="images/profile1.jpg" alt="Employee profile">
                <p>Employee Profile</p>
            </div>
            <div class="employee">
                <img src="images/profile2.jpg" alt="Employee profile">
                <p>Employee Profile</p>
            </div>
            <div class="employee">
                <img src="images/profile3.jpg" alt="Employee profile">
                <p>Employee Profile</p>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 🌴 Caio Second 🌞 Fortaleza, Brazil</p>
        <nav class="socialmedia">
            <a href="facebook.com">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>
            <a href="instagram.com">
                <img src="images/instagram.png" alt="Instagram icon">
            </a>
            <a href="linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin icon">
            </a>
        </nav>
    </footer>
</body>

</html>
